services:
  - type: web
    name: retro-rewind-relay
    runtime: python
    plan: free
    region: virginia
    buildCommand: pip install -r requirements.txt
    startCommand: python relay_server.py
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://retro-rewind-web-lj.netlify.app,http://127.0.0.1:8088,http://127.0.0.1:8089
